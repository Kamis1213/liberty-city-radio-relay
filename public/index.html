<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liberty City FD Radio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>LIBERTY CITY FIRE RADIO</h1>
    <div><span id="users">0 USERS</span> · <span id="conn">Connecting...</span></div>
  </header>

  <main>
    <section class="panel">
      <h2>Radio Console</h2>
      <label>Unit / Callsign
        <input id="unit" placeholder="Engine 1" maxlength="60">
      </label>

      <button id="audio">Enable Radio Audio</button>
      <button id="mic">Enable Microphone</button>

      <div id="micstatus" class="status">MICROPHONE OFF</div>
      <div id="rxstatus" class="status">RADIO CLEAR</div>

      <button id="ptt" class="ptt" disabled>HOLD TO TALK</button>
      <p class="note">Enable the microphone once, then hold PTT while speaking. Release PTT when finished.</p>
    </section>

    <section class="panel">
      <h2>Dispatch Feed</h2>
      <div id="feed"></div>
    </section>
  </main>

  <div id="alert" class="alert hidden"></div>
  <div id="remote-audio"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
